<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Sink</title>
  <style>
    /* -----------------------------------------------------------------------
       CSS Variables
    ----------------------------------------------------------------------- */
    :root {
      --bg:         #1a1a1a;
      --panel:      #252525;
      --panel2:     #2e2e2e;
      --border:     #3a3a3a;
      --accent:     #4a9eff;
      --accent-dim: #2a5a9a;
      --text:       #e0e0e0;
      --text-dim:   #888888;
      --text-muted: #555555;
      --success:    #44cc88;
      --warning:    #ffaa22;
      --danger:     #ff4444;
      --topbar-h:   44px;
      --statusbar-h:28px;
      --left-w:     220px;
      --right-w:    280px;
    }

    /* -----------------------------------------------------------------------
       Reset / base
    ----------------------------------------------------------------------- */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 13px;
      color: var(--text);
      background: var(--bg);
    }

    /* -----------------------------------------------------------------------
       Layout skeleton
    ----------------------------------------------------------------------- */
    #app {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
    }

    /* Top bar */
    #topbar {
      display: flex;
      align-items: center;
      gap: 12px;
      height: var(--topbar-h);
      padding: 0 16px;
      background: #111111;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      z-index: 10;
    }

    #topbar .logo {
      font-size: 16px;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: 0.04em;
      white-space: nowrap;
    }

    #topbar .sep {
      width: 1px;
      height: 22px;
      background: var(--border);
    }

    #topbar label {
      color: var(--text-dim);
      white-space: nowrap;
    }

    #scene-select {
      background: var(--panel2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 4px 8px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
    }

    #scene-select:focus { outline: 1px solid var(--accent); }

    #scene-name {
      color: var(--text-dim);
      font-size: 12px;
    }

    .spacer { flex: 1; }

    #status-indicator {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--text-dim);
    }

    #status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--text-muted);
      transition: background 0.3s;
    }

    /* Main content row */
    #main {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* -----------------------------------------------------------------------
       Left panel — Object list
    ----------------------------------------------------------------------- */
    #left-panel {
      width: var(--left-w);
      min-width: var(--left-w);
      background: var(--panel);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .panel-header {
      padding: 10px 12px 8px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-dim);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    #object-list {
      flex: 1;
      overflow-y: auto;
      padding: 4px 0;
    }

    .obj-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 14px;
      cursor: pointer;
      border-left: 2px solid transparent;
      transition: background 0.12s, border-color 0.12s;
      user-select: none;
    }

    .obj-item:hover  { background: var(--panel2); }

    .obj-item.selected {
      background: #1e2e42;
      border-left-color: var(--accent);
      color: #c8e0ff;
    }

    .obj-icon {
      font-size: 14px;
      color: var(--text-dim);
      width: 18px;
      text-align: center;
    }

    /* -----------------------------------------------------------------------
       Viewport
    ----------------------------------------------------------------------- */
    #viewport-wrap {
      flex: 1;
      position: relative;
      overflow: hidden;
      background: var(--bg);
    }

    #viewport-canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    #viewport-hint {
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.55);
      color: var(--text-muted);
      font-size: 11px;
      padding: 4px 10px;
      border-radius: 4px;
      pointer-events: none;
      white-space: nowrap;
    }

    /* -----------------------------------------------------------------------
       Right panel — Tabs
    ----------------------------------------------------------------------- */
    #right-panel {
      width: var(--right-w);
      min-width: var(--right-w);
      background: var(--panel);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Tab strip */
    .tab-strip {
      display: flex;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .tab-btn {
      flex: 1;
      padding: 10px 0;
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      color: var(--text-dim);
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      cursor: pointer;
      transition: color 0.15s, border-color 0.15s;
    }

    .tab-btn:hover  { color: var(--text); }
    .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }

    /* Tab content areas */
    .tab-content {
      display: none;
      flex: 1;
      overflow-y: auto;
      padding: 10px;
    }

    .tab-content.active { display: block; }

    /* Bindings panel */
    .panel-section-title {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--accent);
      margin: 8px 0 10px;
    }

    /* Label chips — clickable hints at top of bindings panel */
    .label-chips-section {
      padding: 8px 10px 6px;
      border-bottom: 1px solid var(--border);
    }

    .label-chips-title {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--text-muted);
      margin-bottom: 5px;
    }

    .label-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }

    .label-chip {
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: 10px;
      padding: 2px 6px;
      background: #1e2e42;
      color: var(--accent);
      border: 1px solid var(--accent-dim);
      border-radius: 3px;
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
    }

    .label-chip:hover { background: #253848; }

    .no-labels-hint {
      font-size: 11px;
      color: var(--text-muted);
      font-style: italic;
    }

    /* Binding rows — expression inputs */
    .binding-row {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 4px 10px;
      border-bottom: 1px solid #222;
    }

    .prop-name {
      font-size: 10px;
      color: var(--text-muted);
      font-family: 'Consolas', 'Courier New', monospace;
      flex-shrink: 0;
      width: 38px;
    }

    .expr-input {
      flex: 1;
      background: var(--panel2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 3px 6px;
      border-radius: 3px;
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: 11px;
      min-width: 0;
      outline: none;
    }

    .expr-input:focus { border-color: var(--accent); }
    .expr-input.expr-ok  { border-color: #2a6640; }
    .expr-input.expr-err { border-color: #662222; }

    .binding-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
      background: var(--text-muted);
      transition: background 0.2s;
    }

    /* Data panel */
    .data-section {
      margin-bottom: 16px;
    }

    .data-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 11px;
    }

    .data-table th {
      text-align: left;
      padding: 4px 6px;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border);
      font-weight: 600;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .data-table td {
      padding: 4px 6px;
      border-bottom: 1px solid #222222;
      color: var(--text-dim);
      vertical-align: middle;
    }

    .data-table tr:first-child td { color: var(--text); }

    .value-cell {
      font-family: 'Consolas', 'Courier New', monospace;
      text-align: right;
    }

    .no-data-row td {
      color: var(--text-muted);
      font-style: italic;
      text-align: center;
      padding: 10px;
    }

    /* Shared helpers */
    .empty-hint {
      color: var(--text-muted);
      font-size: 12px;
      font-style: italic;
      padding: 20px 12px;
      text-align: center;
      line-height: 1.6;
    }

    /* -----------------------------------------------------------------------
       Status bar
    ----------------------------------------------------------------------- */
    #statusbar {
      height: var(--statusbar-h);
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 0 14px;
      background: #111111;
      border-top: 1px solid var(--border);
      flex-shrink: 0;
      font-size: 11px;
      color: var(--text-muted);
    }

    #statusbar span { white-space: nowrap; }

    /* -----------------------------------------------------------------------
       All Data panel
    ----------------------------------------------------------------------- */
    #alldata-panel {
      padding: 0;
    }

    #alldata-search {
      width: 100%;
      background: var(--panel2);
      border: none;
      border-bottom: 1px solid var(--border);
      color: var(--text);
      padding: 8px 12px;
      font-size: 12px;
      outline: none;
    }

    #alldata-search::placeholder { color: var(--text-muted); }

    #alldata-table-wrap {
      overflow-y: auto;
      height: 100%;
    }

    #alldata-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }

    #alldata-table thead th {
      position: sticky;
      top: 0;
      background: #1e1e1e;
      text-align: left;
      padding: 6px 10px;
      color: var(--text-muted);
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      border-bottom: 1px solid var(--border);
      z-index: 1;
    }

    #alldata-table tbody tr {
      border-bottom: 1px solid #222;
      transition: background 0.1s;
    }

    #alldata-table tbody tr:hover { background: var(--panel2); }

    #alldata-table td {
      padding: 6px 10px;
      vertical-align: middle;
    }

    .alldata-label {
      color: var(--text);
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: 11px;
      word-break: break-all;
    }

    .alldata-value {
      color: var(--accent);
      font-family: 'Consolas', 'Courier New', monospace;
      text-align: right;
      white-space: nowrap;
      font-size: 12px;
      font-weight: 600;
    }

    .alldata-age {
      color: var(--text-muted);
      font-size: 10px;
      text-align: right;
      white-space: nowrap;
    }

    .alldata-age.fresh  { color: var(--success); }
    .alldata-age.stale  { color: var(--warning); }

    /* -----------------------------------------------------------------------
       Config bar (presets + export/import)
    ----------------------------------------------------------------------- */
    #config-bar {
      display: flex;
      flex-direction: column;
      gap: 5px;
      padding: 7px 8px;
      background: #1e1e1e;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .cfg-row {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    #preset-select {
      flex: 1;
      min-width: 0;
      background: var(--panel2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 4px 6px;
      border-radius: 3px;
      font-size: 12px;
      cursor: pointer;
    }

    #preset-select:focus { outline: 1px solid var(--accent); }

    .cfg-btn {
      background: var(--panel2);
      border: 1px solid var(--border);
      color: var(--text-dim);
      padding: 4px 8px;
      border-radius: 3px;
      font-size: 11px;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .cfg-btn:hover  { color: var(--text); border-color: #555; }
    .cfg-btn.accent { border-color: var(--accent-dim); color: var(--accent); }
    .cfg-btn.accent:hover { background: #1e2e42; }
    .cfg-btn.danger { color: #884444; }
    .cfg-btn.danger:hover { color: var(--danger); border-color: var(--danger); }

    .cfg-spacer { flex: 1; }

    #import-file-input { display: none; }

    /* -----------------------------------------------------------------------
       Scrollbar styling
    ----------------------------------------------------------------------- */
    ::-webkit-scrollbar              { width: 6px; }
    ::-webkit-scrollbar-track        { background: var(--panel); }
    ::-webkit-scrollbar-thumb        { background: var(--border); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover  { background: #555; }
  </style>
</head>
<body>

<div id="app">

  <!-- =====================================================================
       Top bar
  ====================================================================== -->
  <div id="topbar">
    <span class="logo">The Sink</span>
    <div class="sep"></div>
    <label for="scene-select">Scene</label>
    <select id="scene-select"></select>
    <span id="scene-name"></span>
    <div class="spacer"></div>
    <div id="status-indicator">
      <div id="status-dot"></div>
      <span id="status-text">Connecting…</span>
    </div>
  </div>

  <!-- =====================================================================
       Main row: left | viewport | right
  ====================================================================== -->
  <div id="main">

    <!-- Left panel -->
    <div id="left-panel">
      <div class="panel-header">Objects</div>
      <div id="object-list">
        <div class="empty-hint">Loading scene…</div>
      </div>
    </div>

    <!-- Viewport -->
    <div id="viewport-wrap">
      <canvas id="viewport-canvas"></canvas>
      <div id="viewport-hint">
        MMB: orbit &nbsp;|&nbsp; Shift+MMB: pan &nbsp;|&nbsp; Scroll: zoom &nbsp;|&nbsp; 1/3/7/0: preset views
      </div>
    </div>

    <!-- Right panel -->
    <div id="right-panel">

      <!-- Config bar -->
      <div id="config-bar">
        <!-- Row 1: preset select + actions -->
        <div class="cfg-row">
          <select id="preset-select"><option value="">— Presets —</option></select>
          <button class="cfg-btn"        id="btn-preset-load"   title="Load selected preset">Load</button>
          <button class="cfg-btn accent" id="btn-preset-save"   title="Save current bindings as preset">Save</button>
          <button class="cfg-btn danger" id="btn-preset-delete" title="Delete selected preset">✕</button>
        </div>
        <!-- Row 2: file ops + clear -->
        <div class="cfg-row">
          <button class="cfg-btn" id="btn-export">Export JSON</button>
          <label  class="cfg-btn" id="btn-import">
            Import JSON
            <input type="file" id="import-file-input" accept=".json">
          </label>
          <div class="cfg-spacer"></div>
          <button class="cfg-btn danger" id="btn-clear-scene" title="Remove all bindings for the current scene">Clear All</button>
        </div>
      </div>

      <div class="tab-strip">
        <button class="tab-btn active" data-tab="bindings">Bindings</button>
        <button class="tab-btn"        data-tab="data">Data</button>
        <button class="tab-btn"        data-tab="alldata">All Data</button>
      </div>
      <div id="tab-bindings" class="tab-content active">
        <div id="bindings-panel">
          <div class="empty-hint">Select an object to configure bindings</div>
        </div>
      </div>
      <div id="tab-data" class="tab-content">
        <div id="data-panel">
          <div class="empty-hint">Select an object to view data</div>
        </div>
      </div>
      <div id="tab-alldata" class="tab-content">
        <div id="alldata-panel">
          <div class="empty-hint">No data ingested yet</div>
        </div>
      </div>
    </div>

  </div><!-- /#main -->

  <!-- =====================================================================
       Status bar
  ====================================================================== -->
  <div id="statusbar">
    <span id="last-update">Not yet updated</span>
    <span>|</span>
    <span>POST /api/ingest.php &nbsp;·&nbsp; GET /api/labels.php &nbsp;·&nbsp; GET /api/data.php?label=…</span>
  </div>

</div><!-- /#app -->

<!-- Three.js from CDN -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<!-- App scripts -->
<script src="/js/viewport.js"></script>
<script src="/js/main.js"></script>

</body>
</html>
